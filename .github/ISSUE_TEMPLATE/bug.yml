name: Bug
description: Something is broken.
title: "[Bug] "
labels: ["type:bug"]
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: One or two sentences describing the problem.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour
    validations:
      required: true
  - type: input
    id: build
    attributes:
      label: Build or commit
      description: Version, commit SHA or branch where the bug happens.
      placeholder: "e.g. main @ 9fc8c37"
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs, screenshots or recordings
      description: Paste logs in a code block. Drag and drop images or videos.
    validations:
      required: false
