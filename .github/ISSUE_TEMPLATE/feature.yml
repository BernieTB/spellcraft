name: Feature
description: A gameplay or player-facing capability.
title: "[Feature] "
labels: ["type:feature"]
body:
  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: >-
        What the player should be able to do or experience.
        Link the relevant section of docs/GAME_DESIGN.md.
      placeholder: |
        The player can ...
        Design: docs/GAME_DESIGN.md#spell-line
    validations:
      required: true
  - type: textarea
    id: acceptance-criteria
    attributes:
      label: Acceptance criteria
      description: Every item must be verifiable (by a test or a clear manual check).
      value: |
        - [ ]
    validations:
      required: true
  - type: textarea
    id: technical-notes
    attributes:
      label: Technical notes
      description: Modules touched (Core, Unity), constraints, links to ADRs in docs/adr/.
    validations:
      required: false
  - type: textarea
    id: out-of-scope
    attributes:
      label: Out of scope
      description: What this ticket deliberately does not cover.
    validations:
      required: false
