# Builds the Windows 64-bit player (Mono) after every push to main, and on demand.
# The player is uploaded as a short-lived artifact named after the short commit SHA.
#
# Required repository secrets (Unity Personal license, see https://game.ci/docs/github/activation):
#   UNITY_LICENSE   contents of the .ulf license file
#   UNITY_EMAIL     Unity account email
#   UNITY_PASSWORD  Unity account password
name: Build

on:
    push:
        branches: [main]
    workflow_dispatch:

concurrency:
    group: build-${{ github.ref }}
    cancel-in-progress: true

permissions:
    contents: read

jobs:
    build-windows:
        name: Build Windows player
        # A Linux runner can cross-compile a Windows player with the Mono backend
        # (https://game.ci/docs/github/builder#targetplatform). IL2CPP would need a Windows runner.
        runs-on: ubuntu-latest
        timeout-minutes: 90
        steps:
            # The Unity editor image is ~11 GB and the job needs ~14 GB in total. Hosted runner disks vary;
            # this step reclaims ~22 GB (Android SDK, .NET, Haskell, Docker images) in 1-2 min, which
            # covers the smaller hosts. The df steps log the margin so a shrinking one is visible.
            - name: Free disk space
              uses: jlumbroso/free-disk-space@v2
              with:
                  large-packages: false

            - name: Disk space after cleanup
              run: df -h /

            - name: Checkout
              uses: actions/checkout@v7
              with:
                  # Full history so the builder's default Semantic versioning can count commits.
                  fetch-depth: 0
                  lfs: false # pulled below, through the LFS cache
                  persist-credentials: false

            # Git LFS objects are cached so each one is downloaded once, not on every run (LFS bandwidth
            # quota). The key is the hash of the sorted LFS object IDs, written outside the workspace so the
            # tree stays clean for the builder. With no LFS files yet, an empty cache is saved and restored.
            - name: List LFS objects
              id: lfs
              shell: bash # -o pipefail: fail if git lfs ls-files fails instead of hashing an empty list
              run: |
                  git lfs ls-files --long | cut -d' ' -f1 | sort > "$RUNNER_TEMP/lfs-ids.txt"
                  echo "LFS objects: $(wc -l < "$RUNNER_TEMP/lfs-ids.txt")"
                  echo "hash=$(sha256sum "$RUNNER_TEMP/lfs-ids.txt" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
                  mkdir -p .git/lfs/objects

            - name: Cache LFS objects
              uses: actions/cache@v6
              with:
                  path: .git/lfs/objects
                  key: lfs-${{ steps.lfs.outputs.hash }}
                  restore-keys: lfs-

            # Only objects missing from the cache are downloaded. The token is passed for this command
            # only, the same way actions/checkout does, since credentials are not persisted. Its base64 form
            # is masked (GitHub only masks the raw token). `git lfs install --local` sets up the LFS filters
            # as checkout's `lfs: true` would, so pulled files do not show as modified to the builder.
            - name: Pull LFS objects
              env:
                  GITHUB_TOKEN: ${{ github.token }}
              run: |
                  auth=$(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 -w0)
                  echo "::add-mask::$auth"
                  git lfs install --local
                  git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" lfs pull
                  git lfs ls-files

            - name: Compute short SHA
              id: vars
              run: echo "short_sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

            # Key per target: the Windows build and the EditMode test run import assets for different
            # targets. The `Library-` fallback still reuses any other Library cache on a miss.
            - name: Cache Library
              uses: actions/cache@v6
              with:
                  path: game/Library
                  key: Library-StandaloneWindows64-${{ hashFiles('game/Assets/**', 'game/Packages/**', 'game/ProjectSettings/**') }}
                  restore-keys: |
                      Library-StandaloneWindows64-
                      Library-

            - name: Build
              uses: game-ci/unity-builder@v6
              env:
                  UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
                  UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
                  UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
              with:
                  # game-ci/cli binary the action runs; pinned for reproducible builds (same as tests.yml).
                  cliVersion: v0.1.69
                  projectPath: game
                  targetPlatform: StandaloneWindows64
                  buildName: Spellcraft
                  buildsPath: build # uploaded below from build/StandaloneWindows64

            # Runs even when the Unity step fails, e.g. with "no space left on device".
            - name: Disk space after Unity
              if: always()
              run: df -h /

            - name: Upload player
              uses: actions/upload-artifact@v7
              with:
                  name: Spellcraft-Windows64-${{ steps.vars.outputs.short_sha }}
                  path: build/StandaloneWindows64
                  retention-days: 7
                  if-no-files-found: error
