name: Tests

on:
    pull_request:
        branches: [main]
    workflow_dispatch:

concurrency:
    group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
    cancel-in-progress: true

permissions:
    contents: read
    checks: write # test results check run created by the test runner

jobs:
    editmode:
        name: EditMode tests
        runs-on: ubuntu-latest
        timeout-minutes: 60
        steps:
            # The Unity editor image is ~11 GB and the job needs ~14 GB in total. Hosted runner disks vary;
            # this step reclaims ~22 GB (Android SDK, .NET, Haskell, Docker images) in 1-2 min, which
            # covers the smaller hosts. The df steps log the margin so a shrinking one is visible.
            - name: Free disk space
              uses: jlumbroso/free-disk-space@v2
              with:
                  large-packages: false

            - name: Disk space after cleanup
              run: df -h /

            - name: Checkout
              uses: actions/checkout@v7
              with:
                  lfs: false # pulled below, through the LFS cache
                  persist-credentials: false

            # Git LFS objects are cached so each one is downloaded once, not on every run (LFS bandwidth
            # quota). The key is the hash of the sorted LFS object IDs, written outside the workspace so the
            # tree stays clean for the builder. With no LFS files yet, an empty cache is saved and restored.
            - name: List LFS objects
              id: lfs
              run: |
                  git lfs ls-files --long | cut -d' ' -f1 | sort > "$RUNNER_TEMP/lfs-ids.txt"
                  echo "LFS objects: $(wc -l < "$RUNNER_TEMP/lfs-ids.txt")"
                  echo "hash=$(sha256sum "$RUNNER_TEMP/lfs-ids.txt" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
                  mkdir -p .git/lfs/objects

            - name: Cache LFS objects
              uses: actions/cache@v6
              with:
                  path: .git/lfs/objects
                  key: lfs-${{ steps.lfs.outputs.hash }}
                  restore-keys: lfs-

            # Only objects missing from the cache are downloaded. The token is passed for this command
            # only, the same way actions/checkout does, since credentials are not persisted.
            - name: Pull LFS objects
              env:
                  GITHUB_TOKEN: ${{ github.token }}
              run: |
                  auth=$(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 -w0)
                  git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" lfs pull
                  git lfs ls-files

            # Key per job type: the test run and the Windows build import assets for different targets.
            # The `Library-` fallback lets a PR start from the build cache saved on main.
            - name: Cache Library
              uses: actions/cache@v6
              with:
                  path: game/Library
                  key: Library-EditMode-${{ hashFiles('game/Assets/**', 'game/Packages/**', 'game/ProjectSettings/**') }}
                  restore-keys: |
                      Library-EditMode-
                      Library-

            - name: Run EditMode tests
              id: tests
              uses: game-ci/unity-test-runner@v4
              env:
                  UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
                  UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
                  UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
              with:
                  # game-ci/cli binary the action runs; pinned for reproducible runs (same as build.yml).
                  cliVersion: v0.1.69
                  projectPath: game
                  unityVersion: auto # read from game/ProjectSettings/ProjectVersion.txt
                  testMode: EditMode
                  artifactsPath: test-results
                  githubToken: ${{ secrets.GITHUB_TOKEN }}
                  checkName: EditMode Test Results

            # Runs even when the Unity step fails, e.g. with "no space left on device".
            - name: Disk space after Unity
              if: always()
              run: |
                  df -h /
                  docker image ls

            - name: Upload test results
              if: always()
              uses: actions/upload-artifact@v7
              with:
                  name: editmode-test-results
                  path: ${{ steps.tests.outputs.artifactsPath || 'test-results' }}
                  if-no-files-found: warn
