name: Tests

on:
    pull_request:
        branches: [main]
    workflow_dispatch:

concurrency:
    group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
    cancel-in-progress: true

permissions:
    contents: read
    checks: write # test results check run created by the test runner

jobs:
    editmode:
        name: EditMode tests
        runs-on: ubuntu-latest
        timeout-minutes: 60
        steps:
            # The Unity editor image is large; reclaim space on the hosted runner first.
            - name: Free disk space
              uses: jlumbroso/free-disk-space@v2
              with:
                  large-packages: false

            - name: Disk space after cleanup
              run: df -h / /mnt

            - name: Checkout
              uses: actions/checkout@v7
              with:
                  lfs: true
                  persist-credentials: false

            # Key per job type: the test run and the Windows build import assets for different targets.
            # The `Library-` fallback lets a PR start from the build cache saved on main.
            - name: Cache Library
              uses: actions/cache@v6
              with:
                  path: game/Library
                  key: Library-EditMode-${{ hashFiles('game/Assets/**', 'game/Packages/**', 'game/ProjectSettings/**') }}
                  restore-keys: |
                      Library-EditMode-
                      Library-

            - name: Run EditMode tests
              id: tests
              uses: game-ci/unity-test-runner@v4
              env:
                  UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
                  UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
                  UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
              with:
                  # game-ci/cli binary the action runs; pinned for reproducible runs (same as build.yml).
                  cliVersion: v0.1.69
                  projectPath: game
                  unityVersion: auto # read from game/ProjectSettings/ProjectVersion.txt
                  testMode: EditMode
                  artifactsPath: test-results
                  githubToken: ${{ secrets.GITHUB_TOKEN }}
                  checkName: EditMode Test Results

            # Runs even when the Unity step fails, e.g. with "no space left on device".
            - name: Disk space after Unity
              if: always()
              run: |
                  df -h / /mnt
                  docker image ls

            - name: Upload test results
              if: always()
              uses: actions/upload-artifact@v7
              with:
                  name: editmode-test-results
                  path: ${{ steps.tests.outputs.artifactsPath || 'test-results' }}
                  if-no-files-found: warn
